name: Java CI

on:
    push:
      branches:
        - 'main'

jobs:
  built:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup-Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Docker Image
        run: |
          - pwd
          - ls -al

     
