name: Java CI

on:
  push:
    branches:
      - '!main'

  pull_request:
    branches:
      - main

jobs:
  built:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Tools
        run: |
          git --version
          java -version
          mvn -version
          docker --version

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devopswebapp:latest \
            -f src/Dockerfile .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devopswebapp:latest
