name: CD - Deploy Application

on:
  workflow_run:
    workflows:
      - Java CI
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Pull Docker Image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devopswebapp:1.0

      - name: Stop Existing Container
        run: |
          docker stop devopswebapp || true
          docker rm devopswebapp || true

      - name: Run New Container
        run: |
          docker run -d \
            --name devopswebapp \
            -p 8081:8080 \
            ${{ secrets.DOCKERHUB_USERNAME }}/devopswebapp:1.0

      - name: Check Container
        run: |
          docker ps
          docker logs --tail 50 devopswebapp
